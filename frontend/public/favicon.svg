<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="SMH Achievers Life Group">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d9b90"/>
      <stop offset="48%" stop-color="#3c7269"/>
      <stop offset="100%" stop-color="#1d3a35"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cd82"/>
      <stop offset="55%" stop-color="#d9a943"/>
      <stop offset="100%" stop-color="#b28535"/>
    </linearGradient>
  </defs>
  <!-- Shield, drawn edge-to-edge: a browser tab renders this at 16px, so the usual padding would
       cost about a third of the readable area for nothing. -->
  <path d="M32 2 L60 11.5 V32 C60 46.5 47.8 57.5 32 63.5 C16.2 57.5 4 46.5 4 32 V11.5 Z" fill="url(#t)"/>
  <!-- Only the leading chevron survives at tab size; the trailing one is kept faint so it reads as
       depth at 32px and simply disappears at 16px rather than turning into mud. -->
  <path d="M19 33.5 L32 20.5 L45 33.5" fill="none" stroke="url(#g)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21.5 46 L32 35.5 L42.5 46" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
