<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1f7eff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rock Communication Insurance Agency — modern call center and policy management platform." />
    <title>Rock Communication Insurance Agency</title>
    <style>
      /* Instant, branded loading screen shown before the app bundle boots. React
         replaces #root on mount, so this vanishes automatically. Themed + reduced-motion aware. */
      #app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:26px;background:#f6f8fb;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .aps-brand{display:flex;align-items:center;gap:12px}
      .aps-logo{filter:drop-shadow(0 8px 16px rgba(31,126,255,.35))}
      .aps-text{display:flex;flex-direction:column;line-height:1.15}
      .aps-name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:#111827}
      .aps-sub{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a93a3;margin-top:2px}
      .aps-spinner{width:26px;height:26px;border-radius:50%;
        border:2.5px solid rgba(31,126,255,.16);border-top-color:#1f7eff;
        animation:aps-spin .7s linear infinite}
      @keyframes aps-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.aps-spinner{animation-duration:1.6s}}
      @media (prefers-color-scheme:dark){
        #app-splash{background:#0e1219}
        .aps-name{color:#e7eaf1}
        .aps-spinner{border-color:rgba(139,140,249,.2);border-top-color:#8b8cf9}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="aps-brand">
          <svg class="aps-logo" width="36" height="36" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="rcSilver" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f4f6fa" /><stop offset="55%" stop-color="#c8cfdb" /><stop offset="100%" stop-color="#7e8693" />
              </linearGradient>
              <linearGradient id="rcBlue" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3e98ff" /><stop offset="60%" stop-color="#1f7eff" /><stop offset="100%" stop-color="#0a4eba" />
              </linearGradient>
            </defs>
            <path d="M3 46 L18 22 L33 46 Z" fill="url(#rcBlue)" />
            <path d="M14 46 L32 12 L50 46 Z" fill="url(#rcSilver)" />
            <path d="M40 46 L50 26 L61 46 Z" fill="url(#rcBlue)" />
            <path d="M32 12 L24 32" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2" fill="none" />
            <path d="M2 48 C 14 54, 26 42, 32 46 C 38 50, 50 42, 62 48 L 62 52 C 50 46, 38 54, 32 50 C 26 46, 14 58, 2 52 Z" fill="url(#rcBlue)" />
          </svg>
          <div class="aps-text">
            <span class="aps-name">Rock Communication</span>
            <span class="aps-sub">Insurance Agency</span>
          </div>
        </div>
        <div class="aps-spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
