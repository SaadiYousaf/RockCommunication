<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#3c7269" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMH Achievers Life Group — modern call center and policy management platform." />
    <title>SMH Achievers Life Group</title>
    <style>
      /* Instant, branded loading screen shown before the app bundle boots. React
         replaces #root on mount, so this vanishes automatically. Themed + reduced-motion aware. */
      #app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:26px;background:#f6f8fb;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .aps-brand{display:flex;align-items:center;gap:12px}
      .aps-logo{filter:drop-shadow(0 8px 18px rgba(60,114,105,.38))}
      .aps-text{display:flex;flex-direction:column;line-height:1.15}
      .aps-name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:#111827}
      .aps-sub{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a93a3;margin-top:2px}
      .aps-spinner{width:26px;height:26px;border-radius:50%;
        border:2.5px solid rgba(60,114,105,.18);border-top-color:#3c7269;
        animation:aps-spin .7s linear infinite}
      @keyframes aps-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.aps-spinner{animation-duration:1.6s}}
      @media (prefers-color-scheme:dark){
        #app-splash{background:#0e1219}
        .aps-name{color:#e7eaf1}
        .aps-spinner{border-color:rgba(93,155,144,.22);border-top-color:#5d9b90}
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="aps-brand">
          <svg class="aps-logo" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="smhT" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5d9b90" /><stop offset="48%" stop-color="#3c7269" /><stop offset="100%" stop-color="#1d3a35" />
              </linearGradient>
              <linearGradient id="smhG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f0cd82" /><stop offset="55%" stop-color="#d9a943" /><stop offset="100%" stop-color="#b28535" />
              </linearGradient>
            </defs>
            <path d="M32 4.5 L55.5 12.4 V31.2 C55.5 43.9 45.2 53.6 32 59.5 C18.8 53.6 8.5 43.9 8.5 31.2 V12.4 Z" fill="url(#smhT)" />
            <path d="M32 9.2 L51.2 15.6 V30.9 C51.2 41.2 43 49.2 32 54.3 C21 49.2 12.8 41.2 12.8 30.9 V15.6 Z" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.1" />
            <path d="M20.5 32.5 L32 21.5 L43.5 32.5" fill="none" stroke="url(#smhG)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M22.5 43.5 L32 34.4 L41.5 43.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="aps-text">
            <span class="aps-name">SMH Achievers</span>
            <span class="aps-sub">Life Group</span>
          </div>
        </div>
        <div class="aps-spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
